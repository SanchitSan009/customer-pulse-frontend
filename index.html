<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent Foundry · Customer Pulse</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#08080A;--surface:#111216;--surface-2:#17181E;--chip:#1A1C23;--track:#1C1E25;
  --line:#1E2028;--line-2:#2A2D36;
  --ink:#F4F5F7;--ink-2:#D5D8DF;--ink-3:#A3A7B3;--ink-4:#7C8190;
  --blue:#019EFF;--purple:#695DEC;--green:#2DBD7F;--amber:#F5A524;--muted-fill:#3A3E4A;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);overflow:hidden}
#stage{position:absolute;left:50%;top:50%;width:1920px;height:1080px;padding:36px 48px 40px;display:flex;flex-direction:column;gap:26px;color:var(--ink);font-family:'Plus Jakarta Sans',system-ui,sans-serif;transform:translate(-50%,-50%) scale(var(--s,1));transform-origin:center center}
h1,h2,h3,h4,p{margin:0}

/* ---------- header ---------- */
header{height:64px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;gap:32px}
.brand{display:flex;align-items:center;gap:28px}
.brand img{height:60px;width:auto;display:block}
.vr{width:1px;height:48px;background:var(--line-2)}
h1{font-size:30px;line-height:36px;font-weight:700;letter-spacing:-.01em}
.sub{margin-top:4px;font-size:16px;line-height:22px;color:var(--ink-3)}
.right{display:flex;align-items:center;gap:32px}
.pager{display:flex;align-items:center;gap:22px}
.tab{appearance:none;background:none;border:0;padding:6px 0;margin:0;cursor:pointer;font:inherit;display:flex;flex-direction:column;gap:8px;min-width:72px;text-align:left;font-size:15px;line-height:18px;font-weight:600;color:var(--ink-4)}
.tab.on{color:var(--ink)}
.tab:focus-visible{outline:2px solid var(--blue);outline-offset:4px;border-radius:4px}
.tab i{display:block;height:3px;border-radius:2px;background:var(--line-2);overflow:hidden}
.tab i b{display:block;height:100%;width:0;background:var(--pc,var(--ink))}
.paused{display:none;font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.is-paused .paused{display:inline}
.chip{display:inline-flex;align-items:center;height:36px;padding:0 16px;border-radius:999px;border:1px solid var(--line-2);color:var(--ink-3);font-size:14px;font-weight:600;letter-spacing:.02em;white-space:nowrap}
.clock{text-align:right}
.clock .t{font-size:32px;line-height:36px;font-weight:700;font-variant-numeric:tabular-nums}
.clock .t small{font-size:16px;font-weight:500;color:var(--ink-3);margin-left:6px}
.clock .d{font-size:15px;line-height:20px;color:var(--ink-3);margin-top:2px;white-space:nowrap}


/* ---------- pages ---------- */
#pages{position:relative;flex:1;min-height:0}
.page{position:absolute;inset:0;opacity:0;visibility:hidden;transform:translateY(14px);transition:opacity .7s ease,transform .7s ease,visibility 0s linear .7s}
.page.on{opacity:1;visibility:visible;transform:none;transition:opacity .7s ease,transform .7s ease}

/* ---------- shared bits ---------- */
.kpi-live-dot{display:inline-block;width:7px;height:7px;margin-right:7px;border-radius:50%;background:var(--green);vertical-align:middle;flex-shrink:0}
.eyebrow{font-size:14px;line-height:18px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.live{display:inline-flex;align-items:center;gap:8px;height:26px;padding:0 10px;border-radius:999px;background:var(--chip);font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.dot{position:relative;width:8px;height:8px;display:inline-block}
.dot i{position:absolute;inset:0;border-radius:50%;background:var(--a)}
.dot i.ring{animation:liveRing 2.2s ease-out infinite}
@keyframes liveRing{0%{transform:scale(1);opacity:.7}100%{transform:scale(2.8);opacity:0}}
.type{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--ink-3)}
svg text{font-family:'Plus Jakarta Sans',system-ui,sans-serif;font-variant-numeric:tabular-nums}
.tw{fill:var(--ink);font-weight:700}
.tp{fill:var(--ink-3);font-weight:500}
.tx{fill:var(--ink-4);font-weight:500}

/* ---------- overview ---------- */
.overview{display:flex;flex-direction:column;gap:26px}
.strip{height:118px;flex-shrink:0;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));background:var(--surface);border:1px solid var(--line);border-radius:20px}
.tile{padding:20px 28px;border-right:1px solid var(--line);display:flex;flex-direction:column;justify-content:center;gap:8px;min-width:0}
.tile .row{display:flex;align-items:baseline;gap:12px}
.tile .v{font-size:42px;line-height:44px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.tile .n{font-size:15px;font-weight:600;color:var(--ink-3);white-space:nowrap}
.spark-tile{grid-column:span 2;padding:12px 28px;display:flex;flex-direction:column;justify-content:center;gap:6px;min-width:0}
.spark-head{display:flex;justify-content:space-between;align-items:baseline}
.spark-head .lw{font-size:14px;color:var(--ink-3)}
.spark-head .lw b{color:var(--ink);font-variant-numeric:tabular-nums}
.chart{position:relative}
.chart svg{position:absolute;left:0;top:0;display:block}
.lbl{position:absolute;transform:translateX(-50%);font-size:12px;line-height:14px;white-space:nowrap;font-variant-numeric:tabular-nums}
.lbl.sm{font-size:11px;line-height:13px}
.lbl.win{color:var(--ink);font-weight:700}
.lbl.pre{color:var(--ink-3);font-weight:500}
.xl{position:absolute;top:108px;font-size:12px;line-height:14px;color:var(--ink-4);white-space:nowrap}
.cards{flex:1;min-height:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:24px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:24px 28px;display:flex;flex-direction:column;gap:16px;min-height:0;overflow:hidden}
.ch{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.name{display:flex;align-items:center;gap:10px}
.sw{width:12px;height:12px;border-radius:4px;flex-shrink:0;background:var(--a)}
.card h2{font-size:26px;line-height:32px;font-weight:700;letter-spacing:-.01em;white-space:nowrap}
.csub{margin-top:6px;font-size:15px;line-height:20px;color:var(--ink-3)}
.tags{display:flex;flex-direction:column;align-items:flex-end;gap:8px;flex-shrink:0}
.kpis{display:grid;gap:14px;padding-bottom:18px;border-bottom:1px solid var(--line)}
.kpi{display:flex;flex-direction:column;gap:6px;min-width:0}
.kpi .l{font-size:14px;line-height:18px;font-weight:600;color:var(--ink-3);white-space:nowrap}
.kpi .v{line-height:1;font-weight:700;letter-spacing:-.03em;font-variant-numeric:tabular-nums;white-space:nowrap}
.kpi .v span{font-weight:600;color:var(--ink-3);margin-left:2px}
.kpi .d{font-size:13px;line-height:18px;color:var(--ink-3);white-space:nowrap}
.kpi .d b{color:var(--ink)}
.sec{display:flex;flex-direction:column;gap:10px}
.sec.rows-sec{gap:12px}
.sh{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.sh h3{font-size:16px;line-height:20px;font-weight:700}
.sh span{font-size:13px;color:var(--ink-4);white-space:nowrap}
.rows{display:flex;flex-direction:column;gap:10px}
.r .top{display:flex;justify-content:space-between;gap:12px;font-size:15px;line-height:19px}
.r .lab{color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.r .val{white-space:nowrap;font-variant-numeric:tabular-nums}
.r .val b{font-weight:700}
.r .val em{font-style:normal;color:var(--ink-4);margin-left:8px}
.track{height:8px;border-radius:4px;background:var(--track);overflow:hidden;margin-top:6px}
.fill{height:100%;border-radius:4px}
.insight{margin-top:auto;display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:14px;background:var(--surface-2)}
.insight svg{flex-shrink:0;margin-top:1px}
.insight p{font-size:15px;line-height:21px;color:var(--ink-2)}

/* ---------- client detail ---------- */
.detail{display:grid;grid-template-rows:160px 380px minmax(0,1fr);gap:24px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:26px 32px;min-width:0;min-height:0;overflow:hidden;display:flex;flex-direction:column;gap:16px}
.hero{display:grid;grid-template-columns:440px minmax(0,1fr);align-items:stretch;padding:18px 0 18px 32px;gap:0}
.hero-id{display:flex;flex-direction:column;justify-content:center;gap:8px;padding-right:24px;min-width:0}
.hero-id .nm{display:flex;align-items:center;gap:14px}
.hero-id .sq{width:18px;height:18px;border-radius:6px;background:var(--a);flex-shrink:0}
.hero-id h2{font-size:44px;line-height:50px;font-weight:700;letter-spacing:-.02em;white-space:nowrap}
.hero-id p{font-size:17px;line-height:22px;color:var(--ink-3)}
.hero-id .tg{display:flex;gap:14px;align-items:center;margin-top:2px}
.htiles{display:grid;min-width:0}
.ht{border-left:1px solid var(--line);padding:0 28px;display:flex;flex-direction:column;justify-content:center;gap:8px;min-width:0}
.ht .l{font-size:14px;line-height:18px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-3);white-space:nowrap}
.ht .v{font-size:52px;line-height:1;font-weight:700;letter-spacing:-.03em;font-variant-numeric:tabular-nums;white-space:nowrap}
.ht .v span{font-size:26px;color:var(--ink-3);font-weight:600;margin-left:4px}
.ht .d{font-size:15px;line-height:20px;color:var(--ink-3);white-space:nowrap}
.ht .d b{color:var(--ink)}
.row2{display:grid;grid-template-columns:7fr 5fr;gap:24px;min-height:0}
.row3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px;min-height:0}
.ph{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.ph h3{font-size:20px;line-height:24px;font-weight:700}
.ph .note{font-size:14px;color:var(--ink-4);white-space:nowrap}
.legend{display:flex;gap:18px;font-size:14px;color:var(--ink-3);white-space:nowrap}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:7px;vertical-align:-1px}
.funnel{flex:1;display:flex;flex-direction:column;justify-content:space-evenly;gap:14px}
.fr .top{display:flex;justify-content:space-between;gap:12px;font-size:18px;line-height:24px}
.fr .lab{color:var(--ink-2)}
.fr .val{font-variant-numeric:tabular-nums;white-space:nowrap}
.fr .val b{font-weight:700}
.fr .val em{font-style:normal;color:var(--ink-4);margin-left:10px;font-size:16px}
.fr .track{height:12px;border-radius:6px;margin-top:8px}
.fr .fill{border-radius:6px}
.rank{flex:1;display:flex;flex-direction:column;justify-content:space-between;gap:8px}
.rk{display:grid;grid-template-columns:190px minmax(0,1fr) 118px;align-items:center;gap:14px;height:30px}
.rl{font-size:16px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rt{height:12px;border-radius:6px;background:var(--track);overflow:hidden}
.rf{height:100%;border-radius:6px}
.rv{text-align:right;font-size:16px;font-variant-numeric:tabular-nums;white-space:nowrap}
.rv b{font-weight:700}
.rv em{font-style:normal;color:var(--ink-4);margin-left:8px;font-size:14px}
.ins{display:flex;flex-direction:column;gap:16px}
.ii{display:grid;grid-template-columns:32px minmax(0,1fr);gap:14px;align-items:start}
.ii .num{width:32px;height:32px;border-radius:10px;background:var(--chip);box-shadow:inset 0 0 0 1.5px var(--a);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px}
.ii h4{font-size:18px;line-height:24px;font-weight:700}
.ii p{margin-top:3px;font-size:15px;line-height:21px;color:var(--ink-3)}
</style>

/* =====================================================================

   ===================================================================== */
const N = 12, WIN = 4;
const fmt = n => n.toLocaleString('en-US');
const tone = i => (i >= N - WIN ? 'win' : 'pre');
const ICON_CHAT = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z"/></svg>';
const ICON_MIC  = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>';
const iconTrend = c => `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 17l6-6 4 4 8-8"/><path d="M15 7h6v6"/></svg>`;
const liveTag = '<span class="live"><span class="dot"><i class="ring"></i><i></i></span>Live</span>';
const typeTag = c => `<span class="type">${c.voice ? ICON_MIC : ICON_CHAT}${c.voice ? 'Voice agent' : 'Chat agent'}</span>`;
const metricValueAttribute = metric => ({ canonAvgTurns: 'data-canon-value="avg_user_turns"', canonProductsShown: 'data-canon-value="unique_products"', canonComparisonChats: 'data-canon-value="comparison_chats"', canonStoreEnquiries: 'data-canon-value="store_enquiries"', agriconActiveFAs: 'data-agricon-value="active_fas"', agriconProcessingRuns: 'data-agricon-value="processing_runs"', agriconExecutionSuccess: 'data-agricon-value="execution_success"', agriconReviewed: 'data-agricon-value="invoices_reviewed"', agriconFA: 'data-agricon-value="fa_approved"', agriconHQ: 'data-agricon-value="hq_approved"', agriconConversations: 'data-agricon-value="conversations"', piRepeatOrderers: 'data-pi-repeat-orderers-value', piOrders: 'data-pi-orders-value', piInteractions: 'data-pi-interactions-value', piUsers: 'data-pi-users-value', piSuccessfulOrders: 'data-pi-successful-orders-value', canonConversations: 'data-canon-conversations-value' }[metric] || '');
const liveKpiDot = metric => metricValueAttribute(metric) ? '<span class="kpi-live-dot" role="img" aria-label="Connected data source" title="Connected data source"></span>' : '';
const metricChangeAttribute = metric => ({ agriconActiveFAs: 'data-agricon-change="active_fas"', agriconProcessingRuns: 'data-agricon-change="processing_runs"', agriconExecutionSuccess: 'data-agricon-change="execution_success"', agriconReviewed: 'data-agricon-change="invoices_reviewed"', agriconFA: 'data-agricon-change="fa_approved"', agriconHQ: 'data-agricon-change="hq_approved"', agriconConversations: 'data-agricon-change="conversations"', piRepeatOrderers: 'data-pi-repeat-orderers-change', piOrders: 'data-pi-orders-change', piInteractions: 'data-pi-interactions-change', piUsers: 'data-pi-users-change', piSuccessfulOrders: 'data-pi-successful-orders-change', canonConversations: 'data-canon-conversations-change' }[metric] || '');

function barPath(x, top, base, w) {
  const r = Math.min(4, (base - top) / 2, w / 2);
  return `M${x.toFixed(1)},${base} V${(top + r).toFixed(1)} Q${x.toFixed(1)},${top.toFixed(1)} ${(x + r).toFixed(1)},${top.toFixed(1)} ` +
         `H${(x + w - r).toFixed(1)} Q${(x + w).toFixed(1)},${top.toFixed(1)} ${(x + w).toFixed(1)},${(top + r).toFixed(1)} V${base} Z`;
}

/* 12-week trend (bar or line), sized in real pixels, every value labelled */
function svgTrend(o, accent) {
  const { h, min = 0, max, fmt: f } = o;
  const w = o.w;
  const weeks = o.weeks || WEEKS;
  const N = weeks.length;
  const WIN = o.shadeCount || 4;
  const tone = i => i >= N - WIN ? 'win' : 'pre';
  if (o.loading) return `<svg data-pi-orders-main width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" role="img" aria-label="Loading orders per day"><text x="${w/2}" y="${h/2}" text-anchor="middle" class="tp">Connecting to live data…</text></svg>`;
  if (o.series?.every(series=>series.values.every(value=>value===null))) return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" role="img" aria-label="No observations in this period"><text x="${w/2}" y="${h/2}" text-anchor="middle" class="tp" font-size="13">No observations in this period</text></svg>`;
  const padX = o.yAxis ? 54 : 8, rightPad = 8, top = 34, bottom = h - (o.bottomPadding ?? (o.weekdays ? 52 : o.yAxis ? 44 : 32));
  const band = (w - padX - rightPad) / N;
  const x = i => padX + band * (i + 0.5);
  const y = v => bottom - ((v - min) / (max - min)) * (bottom - top);
  const ls = Math.max(12, o.labelSize || 15);
  const labelStep = Math.max(1, Math.ceil(64 / band));
  let s = `<svg ${o.liveMetric ? 'data-pi-orders-main' : ''} width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" role="img" aria-label="${o.title}, ${weeks[0]} to ${weeks[N - 1]}">`;
  s += `<rect x="${(padX + band * (N - WIN)).toFixed(1)}" y="0" width="${(band * WIN).toFixed(1)}" height="${bottom + 6}" rx="8" fill="#FFFFFF" opacity="0.045"/>`;
  if (o.yAxis) {
    [0, 25, 50, 75, 100].forEach(value => {
      const tickY = y(value);
      s += `<line x1="${padX}" x2="${w - rightPad}" y1="${tickY}" y2="${tickY}" stroke="#2A2D36" stroke-width="1" opacity="0.6"/>`;
      s += `<text x="${padX - 10}" y="${tickY + 4}" text-anchor="end" font-size="13" class="tx">${value}%</text>`;
    });
    s += `<line x1="${padX}" x2="${padX}" y1="${top}" y2="${bottom}" stroke="#2A2D36"/>`;
  }
  if (o.type === 'bar') {
    const bw = Math.min(44, band * 0.56);
    s += `<line x1="${padX}" x2="${w - padX}" y1="${bottom + 0.5}" y2="${bottom + 0.5}" stroke="#2A2D36"/>`;
    o.series[0].values.forEach((v, i) => {
      const t = y(v);
      s += `<path d="${barPath(x(i) - bw / 2, t, bottom, bw)}" fill="${accent}" opacity="${i >= N - WIN ? 1 : 0.4}"><title>${weeks[i]}: ${f(v)}</title></path>`;
      if (i % labelStep === 0 || i === N-1) s += `<text x="${x(i).toFixed(1)}" y="${(t - 10).toFixed(1)}" text-anchor="middle" font-size="${ls}" class="t${tone(i)[0]}">${f(v)}</text>`;
    });
  } else {
    o.series.forEach(se => {
      const col = se.color || accent;
      const pts = se.values.map((v, i) => v === null ? null : [x(i), y(v)]);
      s += `<path d="${pts.map((p, i) => p ? ((i && pts[i - 1]) ? 'L' : 'M') + p[0].toFixed(1) + ',' + p[1].toFixed(1) : '').join(' ')}" fill="none" stroke="${col}" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>`;
      pts.forEach((p, i) => {
        if (!p) return;
        s += `<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="${i === N - 1 ? 6 : 4}" fill="${col}" stroke="#111216" stroke-width="2.5"><title>${weeks[i]}: ${f(se.values[i])}</title></circle>`;
        const ly = se.below ? p[1] + ls + 10 : p[1] - 12;
        if (i % labelStep === 0 || i === N-1) s += `<text x="${p[0].toFixed(1)}" y="${ly.toFixed(1)}" text-anchor="middle" font-size="${ls}" class="t${tone(i)[0]}">${f(se.values[i])}</text>`;
      });
    });
  }
  weeks.forEach((wk, i) => {
    if (i % Math.max(labelStep, o.everyOther ? 2 : 1) !== 0 && i !== N-1) return;
    if (i !== N-1 && N-1-i < labelStep) return;
    if (o.weekdays) s += `<text x="${x(i).toFixed(1)}" y="${h - 23}" text-anchor="middle" font-size="13" class="tx">${o.weekdays[i]}</text>`;
    s += `<text x="${x(i).toFixed(1)}" y="${h - 6}" text-anchor="middle" font-size="13" class="tx">${wk}</text>`;
  });
  return s + '</svg>';
}

/* category columns, every value labelled */
function svgColumns(o, accent) {
  const { w, h, max, cats, fmt: f } = o;
  const top = 34, bottom = h - 32, band = w / cats.length, bw = Math.min(76, band * 0.52);
  let s = `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" role="img" aria-label="${o.title}">`;
  s += `<line x1="0" x2="${w}" y1="${bottom + 0.5}" y2="${bottom + 0.5}" stroke="#2A2D36"/>`;
  cats.forEach(([label, v], i) => {
    const cx = band * (i + 0.5), t = bottom - (v / max) * (bottom - top);
    s += `<path d="${barPath(cx - bw / 2, t, bottom, bw)}" fill="${accent}"/>`;
    s += `<text x="${cx.toFixed(1)}" y="${(t - 10).toFixed(1)}" text-anchor="middle" font-size="16" class="tw">${f(v)}</text>`;
    s += `<text x="${cx.toFixed(1)}" y="${h - 6}" text-anchor="middle" font-size="14" class="tp">${label}</text>`;
  });
  return s + '</svg>';
}

    : d.second.type === 'columns'
    ? svgColumns(Object.assign({ w: 526, h: 226 }, d.second), c.accent)
    : svgTrend(Object.assign({ w: 526, h: 226, labelSize: 14, everyOther: true }, d.second), c.accent);
  const secondNote = d.second.liveMetric === 'canonTypes' ? 'Chats · may overlap' : d.second.liveMetric === 'agriconProcessing' ? 'Weekly median' : d.second.liveMetric === 'piCartTime' ? 'Daily median · last 7 highlighted' : d.second.type === 'columns' ? 'last 4 weeks' : '12 weeks · last 4 shaded';

  const insights = d.insights.map(([h, p], i) => `
    <div class="ii"><span class="num">${i + 1}</span><div><h4>${h}</h4><p ${c.short === 'Canon' ? `data-canon-insight="${i}"` : c.short === 'Agricon' ? `data-agricon-insight="${i}"` : c === CUSTOMERS[0] ? `data-pi-funnel-insight="${i}"` : ''}>${p}</p></div></div>`).join('');

  return `
  <section class="page detail" style="--a:${c.accent}" data-accent="${c.accent}" data-source="${sourceKey(c)}" data-label="${c.short}">
    <div class="panel hero">
      <div class="hero-id">
        <div class="nm"><span class="sq"></span><h2>${c.name}</h2></div>
        <p>${c.sub}</p>
        <div class="tg">${liveTag}${typeTag(c)}</div>
      </div>
      <div class="htiles" style="grid-template-columns:repeat(${d.tiles.length},minmax(0,1fr))">${tiles}</div>
    </div>
    <div class="row2">
      <div class="panel">
        <div class="ph"><h3>${c.short === 'Canon' ? liveKpiDot('canonConversations') : ''}${d.main.title}</h3>${legend}</div>
        ${main}
        ${c.short === 'Agricon' ? '<p class="chart-caption">12 completed weeks · last 4 shaded. FA: approved / reviewed. HQ: verified / FA approved, including pending.</p>' : c.short === 'Canon' ? '<p class="chart-caption">Distinct chats by start day and hour in IST · all available data.</p>' : ''}
      </div>
      <div class="panel">
        <div class="ph"><h3>${c.short === 'Canon' ? liveKpiDot('canonConversations') : ''}${c.short === 'Canon' ? 'Conversation depth' : c.rowsTitle}</h3><span class="note" ${c.short === 'Canon' ? 'data-canon-depth-note' : c.short === 'Agricon' ? 'data-agricon-pipeline-note' : c === CUSTOMERS[0] ? 'data-pi-funnel-note' : ''}>${c.short === 'Canon' ? '— chats' : c.short === 'Agricon' ? '— reviewed' : c.rowsNote}</span></div>
        ${c.short === 'Canon' ? '<div data-canon-depth style="width:100%;height:282px;flex-shrink:0"></div>' : c.short === 'Agricon' ? '<div data-agricon-funnel style="width:100%;height:282px;flex-shrink:0"></div>' : `<div class="funnel">${funnel}</div>`}
      </div>
    </div>
    <div class="row3">
      <div class="panel" ${c === CUSTOMERS[0] ? 'data-pi-state-panel' : ''}>
        <div class="ph"><h3>${c === CUSTOMERS[0] ? liveKpiDot('piOrders') : c.short === 'Canon' ? liveKpiDot('canonConversations') : ''}${d.rank.title}</h3><span class="note" ${c.short === 'Canon' ? 'data-canon-printers-note' : c.short === 'Agricon' ? 'data-agricon-rejections-note' : c === CUSTOMERS[0] ? 'data-pi-states-note' : ''}>${c.short === 'Canon' ? 'All available data' : c.short === 'Agricon' ? '— rejected' : d.rank.note}</span>${c === CUSTOMERS[0] ? '<div class="pi-state-switch" role="group" aria-label="State visualization"><button type="button" data-pi-state-view="map" aria-pressed="true">Map</button><button type="button" data-pi-state-view="list" aria-pressed="false">List</button></div>' : ''}</div>
        ${c === CUSTOMERS[0] ? '<div class="pi-state-map" data-pi-state-map>Loading India map…</div>' : ''}
        <div class="rank" ${c === CUSTOMERS[0] ? 'hidden' : ''} ${c.short === 'Canon' ? 'data-canon-printers' : c.short === 'Agricon' ? 'data-agricon-rejections' : c === CUSTOMERS[0] ? 'data-pi-states' : ''}>${(c.short === 'Canon' || c.short === 'Agricon') ? '' : rank}</div>
      </div>
      <div class="panel">
        <div class="ph"><h3>${d.second.liveMetric === 'piCartTime' ? liveKpiDot('piOrders') : c.short === 'Canon' ? liveKpiDot('canonConversations') : ''}${d.second.title}</h3><span class="note" ${d.second.liveMetric === 'piCartTime' ? 'data-pi-cart-time-note' : ''}>${secondNote}</span></div>
        ${second}
      </div>
      <div class="panel">
        <div class="ph"><h3>What we’re seeing</h3><span class="note">auto-insights</span></div>
        <div class="ins">${insights}</div>
      </div>
    </div>
  </section>`;
}

/* =====================================================================
   ROTATION, CLOCK, FIT-TO-SCREEN
   ===================================================================== */
const pagesEl = document.getElementById('pages');
pagesEl.innerHTML = overviewPage() + CUSTOMERS.map(detailPage).join('');
const pages = [...pagesEl.querySelectorAll('.page')];

const pager = document.getElementById('pager');
pager.innerHTML = pages.map((p, i) =>
  `<button class="tab" type="button" data-i="${i}" style="--pc:${p.dataset.accent}"><span>${p.dataset.label}</span><i><b></b></i></button>`
).join('') + '<span class="paused">Paused</span>';
const tabs = [...pager.querySelectorAll('.tab')];

const pageNames = ['overview','pi','agricon','canon','castrol'];
let cur = 0;
function show(i, updateURL = true) {
  cur = (i + pages.length) % pages.length;
  pages.forEach((p,j) => { p.classList.toggle('on',j === cur); p.inert = j !== cur; p.id = 'page-' + pageNames[j]; });
  tabs.forEach((t,j) => {
    t.classList.toggle('on',j === cur);
    t.setAttribute('aria-current',j === cur ? 'page' : 'false');
    t.setAttribute('aria-controls', 'page-' + pageNames[j]);
  });
  if (updateURL) { const url = new URL(location.href); url.searchParams.set('page',pageNames[cur]); history.replaceState(null,'',url); }
  window.dispatchEvent(new CustomEvent('dashboard:pagechange'));
}
tabs.forEach(t => t.addEventListener('click',()=>show(+t.dataset.i)));
pager.addEventListener('keydown',e => {
  if (!['ArrowRight','ArrowLeft','Home','End'].includes(e.key)) return;
  e.preventDefault();
  show(e.key === 'Home' ? 0 : e.key === 'End' ? pages.length-1 : cur + (e.key === 'ArrowRight' ? 1 : -1));
  tabs[cur].focus();
});
window.addEventListener('popstate',()=>show(pageFromURL(),false));
function pageFromURL() {
  const value = new URLSearchParams(location.search).get('page') || 'overview';
  const named = pageNames.indexOf(value);
  return named >= 0 ? named : /^\d+$/.test(value) && Number(value) < pages.length ? Number(value) : 0;
}

function tick() {
  const now = new Date();
  document.getElementById('clockTime').textContent = now.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit', timeZone: 'Asia/Kolkata' });
  document.getElementById('clockDate').textContent = now.toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric', timeZone: 'Asia/Kolkata' });
}
function fit() {
  const scale = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
  document.getElementById('stage').style.setProperty('--s', scale);
}
fit(); window.addEventListener('resize', fit);
show(pageFromURL(), false);
tick(); setInterval(tick, 30000);
</script>
